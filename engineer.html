<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0f172a">
<title>정보처리기사 실기 암기카드</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; overflow: hidden; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
  background: #0f172a; color: #e2e8f0; -webkit-user-select: none; user-select: none;
}
button { font-family: inherit; cursor: pointer; border: none; outline: none; }
.page { display: none; height: 100vh; height: 100dvh; flex-direction: column; }
.page.active { display: flex; }

/* Home */
.home-header { padding: 28px 20px 20px; background: linear-gradient(180deg, rgba(59,130,246,0.15) 0%, transparent 100%); flex-shrink: 0; }
.home-sub { font-size: 13px; color: #94a3b8; letter-spacing: 2px; margin-bottom: 6px; font-weight: 600; }
.home-title { font-size: 24px; font-weight: 800; color: #f1f5f9; line-height: 1.3; }
.progress-box { margin-top: 16px; background: rgba(255,255,255,0.06); border-radius: 12px; padding: 14px 16px; border: 1px solid rgba(255,255,255,0.08); }
.progress-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
.progress-label { font-size: 13px; color: #94a3b8; }
.progress-num { font-size: 13px; color: #60a5fa; font-weight: 700; }
.progress-bar { height: 6px; background: rgba(255,255,255,0.08); border-radius: 3px; overflow: hidden; }
.progress-fill { height: 100%; background: linear-gradient(90deg, #3b82f6, #8b5cf6); border-radius: 3px; transition: width 0.3s; }

.home-scroll { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding-bottom: 32px; }
.btn-row { padding: 12px 20px; display: flex; gap: 10px; }
.btn-all { flex: 1; padding: 14px 12px; border-radius: 12px; font-weight: 700; font-size: 14px; }
.btn-order { border: 1px solid rgba(59,130,246,0.3); background: rgba(59,130,246,0.1); color: #60a5fa; }
.btn-random { border: 1px solid rgba(139,92,246,0.3); background: rgba(139,92,246,0.1); color: #a78bfa; }
.btn-weak { width: 100%; padding: 14px; border-radius: 12px; border: 1px solid rgba(239,68,68,0.3); background: rgba(239,68,68,0.08); color: #f87171; font-weight: 700; font-size: 14px; margin: 0 20px; width: calc(100% - 40px); }
.cat-section { padding: 16px 20px 8px; }
.cat-label { font-size: 13px; color: #64748b; font-weight: 600; margin-bottom: 12px; letter-spacing: 1px; }
.cat-list { display: flex; flex-direction: column; gap: 8px; }
.cat-btn { display: flex; align-items: center; padding: 14px 16px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.06); background: rgba(255,255,255,0.03); text-align: left; gap: 14px; width: 100%; }
.cat-icon { width: 42px; height: 42px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 20px; flex-shrink: 0; }
.cat-info { flex: 1; min-width: 0; }
.cat-name { font-size: 14px; font-weight: 700; color: #e2e8f0; margin-bottom: 4px; }
.cat-meta { font-size: 12px; color: #64748b; }
.cat-badge { width: 36px; height: 36px; border-radius: 18px; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; flex-shrink: 0; }

/* Card View */
.card-header { display: flex; align-items: center; padding: 14px 16px; border-bottom: 1px solid rgba(255,255,255,0.06); flex-shrink: 0; }
.btn-home { background: none; color: #94a3b8; font-size: 14px; padding: 4px 8px; font-weight: 600; }
.card-cat { flex: 1; text-align: center; font-size: 12px; color: #64748b; }
.card-count { font-size: 13px; color: #64748b; font-weight: 600; }
.card-progress { height: 3px; background: rgba(255,255,255,0.05); flex-shrink: 0; }
.card-progress-fill { height: 100%; transition: width 0.3s; }

.card-body { flex: 1; display: flex; flex-direction: column; padding: 20px 16px; gap: 16px; overflow-y: auto; -webkit-overflow-scrolling: touch; }
.q-box { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); border-radius: 16px; padding: 24px 20px; border-left: 4px solid var(--accent); }
.q-label { font-size: 11px; color: #64748b; font-weight: 600; margin-bottom: 10px; letter-spacing: 1px; }
.q-text { font-size: 15px; line-height: 1.7; white-space: pre-line; color: #e2e8f0; font-weight: 500; }

.a-box { border-radius: 16px; padding: 24px 20px; cursor: pointer; transition: all 0.2s; min-height: 80px; display: flex; flex-direction: column; justify-content: center; }
.a-box.hidden { background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.06); }
.a-box.shown { background: rgba(59,130,246,0.08); border: 1px solid rgba(59,130,246,0.2); }
.a-hint { text-align: center; color: #475569; font-size: 14px; font-weight: 600; padding: 12px 0; }
.a-label { font-size: 11px; color: #60a5fa; font-weight: 600; margin-bottom: 10px; letter-spacing: 1px; }
.a-text { font-size: 17px; line-height: 1.7; white-space: pre-line; color: #f1f5f9; font-weight: 700; }

.btn-known { padding: 14px; border-radius: 12px; font-weight: 700; font-size: 14px; transition: all 0.2s; width: 100%; }
.btn-known.off { background: rgba(255,255,255,0.04); color: #94a3b8; }
.btn-known.on { background: rgba(34,197,94,0.15); color: #4ade80; }

.card-nav { display: flex; gap: 10px; padding: 12px 16px; flex-shrink: 0; border-top: 1px solid rgba(255,255,255,0.06); padding-bottom: max(24px, env(safe-area-inset-bottom)); }
.nav-btn { flex: 1; padding: 14px; border-radius: 12px; font-weight: 700; font-size: 14px; }
.nav-prev, .nav-next { background: rgba(255,255,255,0.06); color: #94a3b8; }
.nav-prev.off, .nav-next.off { background: rgba(255,255,255,0.02); color: #334155; }
.nav-flip { flex: 1.5; }

/* Done page */
.done-page { align-items: center; justify-content: center; padding: 40px; }
.done-emoji { font-size: 48px; margin-bottom: 16px; }
.done-title { font-size: 20px; font-weight: 800; margin-bottom: 8px; }
.done-sub { font-size: 14px; color: #94a3b8; margin-bottom: 24px; }
.done-btn { padding: 12px 32px; border-radius: 10px; background: #3b82f6; color: #fff; font-weight: 700; font-size: 15px; }

/* Reset modal */
.modal-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.6); z-index: 100; align-items: center; justify-content: center; padding: 24px; }
.modal-overlay.active { display: flex; }
.modal-box { background: #1e293b; border-radius: 16px; padding: 24px; max-width: 320px; width: 100%; text-align: center; }
.modal-title { font-size: 16px; font-weight: 700; margin-bottom: 8px; }
.modal-desc { font-size: 13px; color: #94a3b8; margin-bottom: 20px; line-height: 1.5; }
.modal-btns { display: flex; gap: 10px; }
.modal-btns button { flex: 1; padding: 12px; border-radius: 10px; font-weight: 700; font-size: 14px; }
.modal-cancel { background: rgba(255,255,255,0.06); color: #94a3b8; }
.modal-confirm { background: rgba(239,68,68,0.2); color: #f87171; }
</style>
</head>
<body>

<!-- Home Page -->
<div id="homePage" class="page active">
  <div class="home-header">
    <div class="home-sub">정보처리기사 실기</div>
    <h1 class="home-title">키워드 암기카드</h1>
    <div class="progress-box">
      <div class="progress-top">
        <span class="progress-label">학습 진도</span>
        <span class="progress-num" id="homeProgress">0/0</span>
      </div>
      <div class="progress-bar"><div class="progress-fill" id="homeProgressBar" style="width:0%"></div></div>
    </div>
  </div>
  <div class="home-scroll">
    <div class="btn-row">
      <button class="btn-all btn-order" onclick="startAll(false)">📖 전체 순서대로</button>
      <button class="btn-all btn-random" onclick="startAll(true)">🔀 전체 랜덤</button>
    </div>
    <div style="padding:0 20px 8px">
      <button class="btn-weak" id="btnWeak" onclick="startWeak()">🔥 아직 모르는 문제만</button>
    </div>
    <div class="cat-section">
      <div class="cat-label">주제별 학습</div>
      <div class="cat-list" id="catList"></div>
    </div>
    <div style="padding:16px 20px">
      <button onclick="showResetModal()" style="width:100%;padding:12px;border-radius:10px;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);color:#64748b;font-size:13px;font-weight:600">
        🗑️ 학습 기록 초기화
      </button>
    </div>
  </div>
</div>

<!-- Card Page -->
<div id="cardPage" class="page">
  <div class="card-header">
    <button class="btn-home" onclick="goHome()">← 홈</button>
    <div class="card-cat" id="cardCat"></div>
    <span class="card-count" id="cardCount"></span>
  </div>
  <div class="card-progress"><div class="card-progress-fill" id="cardProgressBar"></div></div>
  <div class="card-body" id="cardBody">
    <div class="q-box" id="qBox">
      <div class="q-label">Q. 문제</div>
      <div class="q-text" id="qText"></div>
    </div>
    <div class="a-box hidden" id="aBox" onclick="toggleFlip()">
      <div class="a-hint" id="aHint">탭하여 정답 확인 👆</div>
      <div id="aContent" style="display:none">
        <div class="a-label">A. 정답</div>
        <div class="a-text" id="aText"></div>
      </div>
    </div>
    <button class="btn-known off" id="btnKnown" style="display:none" onclick="toggleKnown()"></button>
  </div>
  <div class="card-nav">
    <button class="nav-btn nav-prev" id="btnPrev" onclick="prevCard()">← 이전</button>
    <button class="nav-btn nav-flip" id="btnFlip" onclick="toggleFlip()">정답 보기</button>
    <button class="nav-btn nav-next" id="btnNext" onclick="nextCard()">다음 →</button>
  </div>
</div>

<!-- Done Page -->
<div id="donePage" class="page done-page">
  <div class="done-emoji">🎉</div>
  <div class="done-title">모두 완료!</div>
  <div class="done-sub">모든 문제를 암기했습니다</div>
  <button class="done-btn" onclick="goHome()">홈으로</button>
</div>

<!-- Reset Modal -->
<div class="modal-overlay" id="resetModal">
  <div class="modal-box">
    <div class="modal-title">학습 기록 초기화</div>
    <div class="modal-desc">암기 완료 체크가 모두 초기화됩니다.<br>정말 초기화할까요?</div>
    <div class="modal-btns">
      <button class="modal-cancel" onclick="hideResetModal()">취소</button>
      <button class="modal-confirm" onclick="doReset()">초기화</button>
    </div>
  </div>
</div>

<script>
// ===== DATA =====
const CATEGORIES = [
  { name:"소프트웨어 공학", icon:"⚙️", color:"#2563eb", cards:[
    {q:"시제품을 끊임없이 제작하며 사이클을 반복하는 개발 방법론. 워터폴과 대조적이며, 고객의 변화하는 요구사항에 능동적",a:"애자일(Agile)"},
    {q:"프로그램의 외부 동작은 변경하지 않으면서 내부 구조를 개선하는 것. 쉽게 이해하고 수정하여 빠르게 개발하기 위함",a:"리팩토링(Refactoring)"},
    {q:"시스템이 무엇(What)을 하는지, 사용자가 원하는 동작에 관한 요구사항",a:"기능 요구사항"},
    {q:"어떻게(How) 동작해야 하는지. 장비 구성, 성능, 보안 등 품질 제약사항",a:"비기능 요구사항"},
    {q:"LOC 기법에서 개발 기간 계산식\n(총 라인 수 30,000 / 월간 생산성 300 / 투입 인원 5)",a:"노력(인월) / 투입인원\n= (LOC/생산성)/인원\n= (30000/300)/5 = 20개월"},
    {q:"럼바우(Rumbaugh) 모델링 3가지\n① DFD(자료흐름도) 사용\n② STD(상태변화도) 사용\n③ ERD 사용\n★ 객/동/기 로 암기",a:"① 기능(Function) 모델링\n② 동적(Dynamic) 모델링\n③ 정보(Information/객체) 모델링"},
    {q:"모듈 간 결합도↓ 응집도↑ 가 목표인 소프트웨어 배포 작업",a:"소프트웨어 패키징\n결합도(Coupling) 최소화\n응집도(Cohesion) 최대화"},
    {q:"릴리즈 노트 작성 시 릴리즈 노트 이름, 소프트웨어 이름, 버전, 날짜 등이 포함된 항목",a:"머릿말(Header)"},
    {q:"소프트웨어 개발 과정에서 만들어지는 프로그램, 문서, 데이터 등을 관리하는 것. Git, SVN 등",a:"형상관리(SCM)"},
    {q:"형상 관리 도구 3가지를 고르시오\n(OLAP, CVS, Ant, Maven, Git, Jenkins, SVN, Spring)",a:"CVS, Git, SVN"},
    {q:"식별된 형상 항목에 대한 변경 요구를 검토하여 현재의 기준선(Baseline)이 잘 반영되도록 조정",a:"형상 통제"},
  ]},
  { name:"UML / 설계", icon:"📐", color:"#7c3aed", cards:[
    {q:"UML 다이어그램 중 객체(Object)들을 추상화하여 표현. 이름, 속성, 메소드 3개 구획",a:"클래스(Class) 다이어그램"},
    {q:"UML 구성요소 3가지\n사물, ( ① ), 다이어그램\n( ② ) = 속성과 동작, 직사각형\n( ③ ) = 동작 모아놓은 것, 단독 사용 불가",a:"① 관계(Relationship)\n② 클래스(Class)\n③ 인터페이스(Interface)"},
    {q:"UML 관계 영어 6가지\nAssociation / Aggregation / Composition\nGeneralization / Dependency / Realization",a:"연관 / 집합 / 포함(합성)\n일반화 / 의존 / 실체화"},
    {q:"UML 관계\n① 전체-부분, 서로 독립적\n② 상위=일반적, 하위=구체적",a:"① Aggregation(집합)\n② Generalization(일반화)"},
    {q:"패키지 간 의존 관계를 표현.\n<<import>> 스테레오타입 사용",a:"패키지 다이어그램\n(Package Diagram)"},
    {q:"UML 다이어그램 2대 분류\n구조적(정적) vs 행위적(동적)\n구조적 5가지를 말하시오",a:"클래스 / 패키지 / 객체\n컴포넌트 / 배치"},
    {q:"UML 행위적(동적) 다이어그램 5가지",a:"유스케이스(사용자 관점)\n시퀀스(시간 흐름 위→아래)\n활동(순서도/알고리즘)\n상태(이벤트에 의한 상태 변화)\n통신(객체 간 관계 구조)"},
    {q:"사용자 관점에서 액터와 기능이 등장하는 다이어그램",a:"유스케이스 다이어그램"},
    {q:"시간의 흐름에 따라 위에서 아래로 메시지 교환을 그리는 다이어그램",a:"시퀀스(순차) 다이어그램"},
  ]},
  { name:"디자인 패턴", icon:"🧩", color:"#7c3aed", cards:[
    {q:"GOF 디자인 패턴 3대 분류",a:"생성 - 객체를 어떻게 만들 것인가\n구조 - 어떻게 조합하여 더 큰 구조로\n행위 - 상호작용 방법, 책임 분배"},
    {q:"생성 패턴: 객체 생성을 서브 클래스에서 처리.\n가상 생성자(Virtual Constructor)",a:"Factory Method 패턴"},
    {q:"생성 패턴: 객체를 메모리에 딱 하나만 생성",a:"Singleton(싱글톤) 패턴"},
    {q:"생성 패턴: 복잡한 객체를 단계별로 조립해서 생성",a:"Builder(빌더) 패턴"},
    {q:"생성 패턴: 기존 객체를 복제해서 생성",a:"Prototype(프로토타입) 패턴"},
    {q:"생성 패턴: 연관된 부품을 그룹(군)으로 묶어서 생성",a:"Abstract Factory 패턴"},
    {q:"구조 패턴: 구현부에서 추상층을 분리.\n기능과 구현을 두 개의 별도 클래스로.\n'독립적으로 확장' 키워드",a:"Bridge 패턴"},
    {q:"구조 패턴: 호환되지 않는 인터페이스를 맞춰주는 변환기(돼지코)",a:"Adapter 패턴"},
    {q:"구조 패턴: 복잡한 하위 시스템을 가려주는 통합 인터페이스(큰 정문)",a:"Facade 패턴"},
    {q:"구조 패턴: 실제 객체 대신 일을 처리하는 대리자",a:"Proxy 패턴"},
    {q:"행위 패턴: 한 객체의 상태가 변화하면 다른 객체들에게 전달.\n일대다, Pub/Sub 키워드",a:"Observer 패턴"},
    {q:"행위 패턴: 상위 클래스에서 뼈대(흐름)를 잡고, 하위 클래스에서 세부 구현",a:"Template Method 패턴"},
    {q:"행위 패턴: 알고리즘을 통째로 캡슐화해서 런타임에 교체",a:"Strategy 패턴"},
    {q:"Interpreter, Observer, Command 등은 어떤 분류의 패턴?",a:"행위(Behavioral) 패턴\n클래스나 객체들이 상호작용하는\n방법이나 책임 분배 방법 정의"},
    {q:"SOLID 원칙 5가지 약자 풀이",a:"S - 단일책임(SRP)\nO - 개방폐쇄(OCP)\nL - 리스코프 치환(LSP)\nI - 인터페이스 분리(ISP)\nD - 의존성 역전(DIP)"},
  ]},
  { name:"결합도 / 응집도", icon:"🔗", color:"#dc2626", cards:[
    {q:"결합도 6단계 순서 (강→약)\n★ 내공외제스자 로 암기",a:"내용(Content) → 공통(Common)\n→ 외부(External) → 제어(Control)\n→ 스탬프(Stamp) → 자료(Data)\n※ 자료 결합도가 가장 좋음"},
    {q:"결합도: 남의 내부 변수를 직접 참조하거나 수정",a:"내용 결합도(Content)"},

// Build flat list
const allCards = [];
CATEGORIES.forEach((cat, ci) => {
  cat.cards.forEach(card => {
    allCards.push({ q: card.q, a: card.a, cat: cat.name, icon: cat.icon, color: cat.color, ci: ci });
  });
});
const TOTAL = allCards.length;

// ===== STATE =====
let known = new Set();
let currentCards = [];
let cardIndex = 0;
let flipped = false;
let currentMode = 'home';

function loadKnown() {
  try {
    const d = localStorage.getItem('eip_known');
    if (d) known = new Set(JSON.parse(d));
  } catch(e) {}
}
function saveKnown() {
  try { localStorage.setItem('eip_known', JSON.stringify([...known])); } catch(e) {}
}
loadKnown();

// ===== HOME =====
function renderHome() {
  document.getElementById('homePage').classList.add('active');
  document.getElementById('cardPage').classList.remove('active');
  document.getElementById('donePage').classList.remove('active');
  currentMode = 'home';

  const p = known.size;
  document.getElementById('homeProgress').textContent = p + '/' + TOTAL;
  document.getElementById('homeProgressBar').style.width = (p / TOTAL * 100) + '%';

  const weakCount = TOTAL - p;
  const btnWeak = document.getElementById('btnWeak');
  btnWeak.textContent = '🔥 아직 모르는 문제만 (' + weakCount + '개)';
  btnWeak.style.display = weakCount > 0 ? 'block' : 'none';

  const list = document.getElementById('catList');
  list.innerHTML = '';
  CATEGORIES.forEach((cat, idx) => {
    const catKnown = cat.cards.filter(c => {
      const gi = allCards.findIndex(ac => ac.q === c.q);
      return known.has(gi);
    }).length;
    const total = cat.cards.length;
    const done = catKnown === total;
    const pct = Math.round(catKnown / total * 100);

    const btn = document.createElement('button');
    btn.className = 'cat-btn';
    btn.onclick = () => startCategory(idx);
    btn.innerHTML = `
      <div class="cat-icon" style="background:${cat.color}22">${cat.icon}</div>
      <div class="cat-info">
        <div class="cat-name">${cat.name}</div>
        <div class="cat-meta">${total}문제 · ${catKnown}개 완료</div>
      </div>
      <div class="cat-badge" style="background:${done ? cat.color+'33' : 'rgba(255,255,255,0.05)'};color:${done ? cat.color : '#64748b'}">
        ${done ? '✓' : pct+'%'}
      </div>
    `;
    list.appendChild(btn);
  });
}

// ===== CARD VIEW =====
function showCardPage() {
  document.getElementById('homePage').classList.remove('active');
  document.getElementById('donePage').classList.remove('active');
  document.getElementById('cardPage').classList.add('active');
}

function renderCard() {
  if (currentCards.length === 0) {
    document.getElementById('cardPage').classList.remove('active');
    document.getElementById('donePage').classList.add('active');
    return;
  }
  showCardPage();
  const card = currentCards[cardIndex];
  const gi = card.globalIndex !== undefined ? card.globalIndex : allCards.findIndex(ac => ac.q === card.q);

  document.getElementById('cardCat').textContent = card.icon + ' ' + card.cat;
  document.getElementById('cardCount').textContent = (cardIndex+1) + '/' + currentCards.length;
  document.getElementById('cardProgressBar').style.width = ((cardIndex+1)/currentCards.length*100) + '%';
  document.getElementById('cardProgressBar').style.background = card.color;
  document.getElementById('qBox').style.borderLeftColor = card.color;
  document.getElementById('qText').textContent = card.q;

  const aBox = document.getElementById('aBox');
  const aHint = document.getElementById('aHint');
  const aCont = document.getElementById('aContent');
  const aTextEl = document.getElementById('aText');
  const btnK = document.getElementById('btnKnown');
  const btnFlip = document.getElementById('btnFlip');

  if (flipped) {
    aBox.className = 'a-box shown';
    aHint.style.display = 'none';
    aCont.style.display = 'block';
    aTextEl.textContent = card.a;
    btnK.style.display = 'block';
    btnFlip.textContent = '문제 보기';
    btnFlip.style.background = card.color + '22';
    btnFlip.style.color = card.color;
  } else {
    aBox.className = 'a-box hidden';
    aHint.style.display = 'block';
    aCont.style.display = 'none';
    btnK.style.display = 'none';
    btnFlip.textContent = '정답 보기';
    btnFlip.style.background = card.color + '22';
    btnFlip.style.color = card.color;
  }

  const isK = known.has(gi);
  btnK.className = 'btn-known ' + (isK ? 'on' : 'off');
  btnK.textContent = isK ? '✅ 암기 완료! (탭하여 해제)' : '⬜ 암기 완료로 체크하기';

  const btnP = document.getElementById('btnPrev');
  const btnN = document.getElementById('btnNext');
  btnP.className = 'nav-btn nav-prev' + (cardIndex === 0 ? ' off' : '');
  btnP.disabled = cardIndex === 0;
  btnN.className = 'nav-btn nav-next' + (cardIndex === currentCards.length - 1 ? ' off' : '');
  btnN.disabled = cardIndex === currentCards.length - 1;
}

// ===== ACTIONS =====
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function startAll(random) {
  currentCards = allCards.map((c, i) => ({...c, globalIndex: i}));
  if (random) currentCards = shuffle(currentCards);
  cardIndex = 0; flipped = false;
  renderCard();
}

function startCategory(idx) {
  const cat = CATEGORIES[idx];
  currentCards = cat.cards.map(c => {
    const gi = allCards.findIndex(ac => ac.q === c.q);
    return { q: c.q, a: c.a, cat: cat.name, icon: cat.icon, color: cat.color, globalIndex: gi };
  });
  cardIndex = 0; flipped = false;
  renderCard();
}

function startWeak() {
  currentCards = allCards.map((c, i) => ({...c, globalIndex: i})).filter(c => !known.has(c.globalIndex));
  cardIndex = 0; flipped = false;
  renderCard();
}

function goHome() {
  renderHome();
}

function toggleFlip() {
  flipped = !flipped;
  renderCard();
}

function nextCard() {
  if (cardIndex < currentCards.length - 1) {
    cardIndex++; flipped = false; renderCard();
  }
}

function prevCard() {
  if (cardIndex > 0) {
    cardIndex--; flipped = false; renderCard();
  }
}

function toggleKnown() {
  const card = currentCards[cardIndex];
  const gi = card.globalIndex !== undefined ? card.globalIndex : allCards.findIndex(ac => ac.q === card.q);
  if (known.has(gi)) known.delete(gi);
  else known.add(gi);
  saveKnown();
  renderCard();
}

function showResetModal() { document.getElementById('resetModal').classList.add('active'); }
function hideResetModal() { document.getElementById('resetModal').classList.remove('active'); }
function doReset() {
  known = new Set();
  saveKnown();
  hideResetModal();
  renderHome();
}

// ===== SWIPE =====
let touchStartX = null, touchStartY = null;
document.addEventListener('touchstart', e => {
  touchStartX = e.touches[0].clientX;
  touchStartY = e.touches[0].clientY;
}, { passive: true });
document.addEventListener('touchend', e => {
  if (!touchStartX || currentMode === 'home') return;
  const dx = e.changedTouches[0].clientX - touchStartX;
  const dy = e.changedTouches[0].clientY - touchStartY;
  if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 50) {
    if (dx < 0) nextCard(); else prevCard();
  }
  touchStartX = null;
}, { passive: true });

// ===== KEYBOARD =====
document.addEventListener('keydown', e => {
  if (currentMode === 'home') return;
  if (e.key === 'ArrowLeft') prevCard();
  else if (e.key === 'ArrowRight') nextCard();
  else if (e.key === ' ') { e.preventDefault(); toggleFlip(); }
});

// ===== INIT =====
renderHome();
</script>
</body>
</html>

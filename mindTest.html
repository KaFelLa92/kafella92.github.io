<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Gift Type Psychology Test</title>
  <style>
    body { font-family: 'Arial', sans-serif; background: #f0f0f0; text-align: center; padding: 40px; }
    .container { background: white; padding: 20px; max-width: 500px; margin: auto; border-radius: 10px; box-shadow: 0 0 10px rgba(0,0,0,0.1);}
    .question { font-size: 20px; margin-bottom: 20px; }
    .answer-btn { display: block; margin: 10px auto; padding: 10px 20px; font-size: 16px; cursor: pointer; }
    #result { display: none; font-size: 24px; margin-top: 20px; }
  </style>
</head>
<body>

<div class="container">
  <h1>🎁 Gift Psychology Test</h1>
  <div id="quiz">
    <div class="question" id="question">The question will appear here.</div>
    <button class="answer-btn" onclick="choose(1)">Answer 1</button>
    <button class="answer-btn" onclick="choose(0)">Answer 2</button>
  </div>
  <div id="result"></div>
</div>

<script>
  const questions = [
    { q: "Is the person a planner?", a1: "Yes, very meticulous", a2: "No, more free-spirited" },
    { q: "Are they the emotional type?", a1: "Yes, very sensitive", a2: "No, very practical" },
    { q: "What's most important when choosing a gift?", a1: "The thought behind it", a2: "Practicality!" }
  ];

  let current = 0;
  let score = 0;

  const questionEl = document.getElementById('question');
  const btns = document.querySelectorAll('.answer-btn');
  const resultEl = document.getElementById('result');

  function showQuestion() {
    if (current < questions.length) {
      questionEl.innerText = questions[current].q;
      btns[0].innerText = questions[current].a1;
      btns[1].innerText = questions[current].a2;
    } else {
      showResult();
    }
  }

  function choose(point) {
    score += point;
    current++;
    showQuestion();
  }

  function showResult() {
    document.getElementById('quiz').style.display = 'none';
    resultEl.style.display = 'block';

    let resultText = (score >= 2)
      ? "✨ Recommended Emotional Gifts: Bouquet, Handwritten Letter, Candle"
      : "🔧 Recommended Practical Gifts: Power Bank, Tumbler, Diary";

    resultEl.innerText = resultText;
  }

  showQuestion();
</script>

</body>
</html>
